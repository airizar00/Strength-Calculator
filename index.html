<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strength Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#1c2126;--mute:#5d6770;--line:#d5dade;--accent:#1c2126;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--ink:#eef0f2;--mute:#97a1ab;--line:#2f373e;--accent:#eef0f2;--onaccent:#14181c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.2px}
h1{font-size:2rem;margin:8px 0 4px}
h2{font-size:1.4rem;margin:0 0 12px}
p.sub{color:var(--mute)}
.sub{margin:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
header h1{margin-top:0}
.tools{display:flex;align-items:flex-end;gap:10px}
.tools label{flex:none}
.tools select{width:auto;padding:6px 8px;font-size:.95rem}
#flag{width:46px;height:46px;margin:0;padding:6px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:8px}
#flag svg{width:100%;height:auto;display:block;border-radius:2px}
.grid{display:grid;gap:16px}
.grid section{margin-bottom:0}
@media(min-width:820px){main{max-width:1040px;padding:32px 28px 56px}h1{font-size:2.6rem}.grid{grid-template-columns:1fr 1fr;gap:24px;align-items:start}section{padding:24px}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px}
label{display:block;flex:1;font-size:.9rem;color:var(--mute)}
input[type=number],select{width:100%;margin-top:4px;padding:10px;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{margin-top:14px;width:100%;padding:12px;font:inherit;font-weight:600;color:var(--onaccent);background:var(--accent);border:0;border-radius:6px;cursor:pointer}
.big{font-size:3rem;line-height:1;margin:16px 0 4px}
.note{color:var(--mute);font-size:.9rem;margin:0}
.err{color:#c8312b;margin:12px 0 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{padding:6px 0;text-align:left;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
.bar{display:flex;align-items:center;height:110px;margin:16px 0 8px}
.shaft{height:10px;width:34px;background:#8a949d;border-radius:2px 0 0 2px}
.plate{width:16px;margin-right:3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff}
.list{margin:0;font-weight:600}
details{margin-top:14px}
summary{cursor:pointer;color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips label{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
</style>
</head>
<body>
<main>
<header>
<div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
<div class="tools">
<label><span data-i="units"></span><select id="unit"><option value="kg">kg</option><option value="lb">lb</option></select></label>
<button id="flag" type="button"></button>
</div>
</header>

<div class="grid">
<section aria-labelledby="t1">
<h2 id="t1" data-i="t1"></h2>
<div class="row">
<label><span data-i="wt"></span><input id="w" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<label><span data-i="reps"></span><input id="r" type="number" inputmode="numeric" min="1" max="30" step="1" value="5"></label>
</div>
<button id="b1" data-i="b1"></button>
<div id="o1" aria-live="polite"></div>
</section>

<section aria-labelledby="t2">
<h2 id="t2" data-i="t2"></h2>
<div class="row">
<label><span data-i="tgt"></span><input id="t" type="number" inputmode="decimal" min="0" step="0.5" value="102.5"></label>
<label><span data-i="bar"></span><input id="bw" type="number" inputmode="decimal" min="0" step="0.5" value="20"></label>
</div>
<details><summary data-i="avail"></summary><div class="chips" id="chips"></div></details>
<button id="b2" data-i="b2"></button>
<div id="o2" aria-live="polite"></div>
</section>

<section aria-labelledby="t3">
<h2 id="t3" data-i="tw"></h2>
<label><span data-i="ww"></span><input id="ww" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<button id="b3" data-i="bww"></button>
<div id="o3" aria-live="polite"></div>
</section>

<section aria-labelledby="t4">
<h2 id="t4" data-i="ts"></h2>
<div class="row">
<label><span data-i="rm3"></span><input id="rm3" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<label><span data-i="preset"></span><select id="pre"><option value="5x5@80">5 × 5 @ 80%</option><option value="3x8@70">3 × 8 @ 70%</option><option value="4x6@75">4 × 6 @ 75%</option><option value="5x3@85">5 × 3 @ 85%</option><option value="3x10@65">3 × 10 @ 65%</option></select></label>
</div>
<div class="row" style="margin-top:12px">
<label><span data-i="ns"></span><input id="ns" type="number" inputmode="numeric" min="1" step="1" value="5"></label>
<label><span data-i="reps"></span><input id="nr" type="number" inputmode="numeric" min="1" step="1" value="5"></label>
<label><span data-i="np"></span><input id="np" type="number" inputmode="decimal" min="1" max="100" step="0.5" value="80"></label>
</div>
<button id="b4" data-i="bs"></button>
<div id="o4" aria-live="polite"></div>
</section>
</div>
</main>

<script>
// Texts in both languages (functions can use the current unit)
const I={
 en:{title:'Strength Calculator',sub:'Your estimated max and the plates to load on the bar.',lang:'Language',units:'Units',
  t1:'Estimated one-rep max (1RM)',wt:()=>`Weight (${S.unit})`,reps:'Reps',b1:'Calculate 1RM',
  t2:'Plate calculator',tgt:()=>`Target weight (${S.unit})`,bar:()=>`Bar (${S.unit})`,avail:'Plates available at my gym',b2:'Calculate plates',
  tw:'Warm-up',ww:()=>`Target weight (${S.unit})`,bww:'Calculate warm-up',work:'Target set',persd:'Per side',barOnly:'Bar only',
  wnote:'Rough guide: adjust it to how you feel. Weights are rounded to what you can load.',e4:'The target weight must be above the bar weight.',
  ts:'Sets by percentage',rm3:()=>`Your 1RM (${S.unit})`,preset:'Scheme',ns:'Sets',np:'Percent (%)',bs:'Calculate sets',
  e5:'Enter a 1RM above 0, at least 1 set and 1 rep, and a percentage between 1 and 100.',
  e6:(p,m)=>`At ${p}% of your 1RM you can usually do about ${m} rep${m===1?'':'s'} per set. Lower the reps or the percentage.`,
  sch:(n,r,p)=>`${n} sets × ${r} reps at ${p}% of your 1RM`,rnd:x=>`Exact value ${x} ${S.unit}, rounded to what you can load.`,
  e1:'Enter a weight above 0 and between 1 and 30 reps.',e2:'The target weight must be equal to or greater than the bar weight.',e3:'Select at least one plate.',
  avg:(a,b)=>`Average of the Epley (${a} ${S.unit}) and Brzycki (${b} ${S.unit}) formulas.`,low:' Above 12 reps the estimate is less reliable.',
  pct:'Percentage',load:'Load',side:'Per side: ',none:'Just the bar, no plates.',total:'Total loaded: ',
  short:x=>` The target can't be reached exactly with these plates; ${x} ${S.unit} short.`},
 es:{title:'Calculadora de fuerza',sub:'Tu máximo estimado y los discos que cargar en la barra.',lang:'Idioma',units:'Unidades',
  t1:'Máximo estimado (1RM)',wt:()=>`Peso (${S.unit})`,reps:'Repeticiones',b1:'Calcular 1RM',
  t2:'Discos para la barra',tgt:()=>`Peso objetivo (${S.unit})`,bar:()=>`Barra (${S.unit})`,avail:'Discos disponibles en mi gimnasio',b2:'Calcular discos',
  tw:'Calentamiento',ww:()=>`Peso objetivo (${S.unit})`,bww:'Calcular calentamiento',work:'Serie objetivo',persd:'Por lado',barOnly:'Solo barra',
  wnote:'Guía orientativa: ajústala a cómo te sientas. Los pesos se redondean a lo que puedes cargar.',e4:'El peso objetivo debe ser mayor que el de la barra.',
  ts:'Series por porcentajes',rm3:()=>`Tu 1RM (${S.unit})`,preset:'Esquema',ns:'Series',np:'Porcentaje (%)',bs:'Calcular series',
  e5:'Introduce un 1RM mayor que 0, al menos 1 serie y 1 repetición, y un porcentaje entre 1 y 100.',
  e6:(p,m)=>`Al ${p}% de tu 1RM normalmente se hacen unas ${m} repeticion${m===1?'':'es'} por serie. Baja las repeticiones o el porcentaje.`,
  sch:(n,r,p)=>`${n} series × ${r} repeticiones al ${p}% de tu 1RM`,rnd:x=>`Valor exacto ${x} ${S.unit}, redondeado a lo que puedes cargar.`,
  e1:'Introduce un peso mayor que 0 y entre 1 y 30 repeticiones.',e2:'El peso objetivo debe ser igual o mayor que el de la barra.',e3:'Selecciona al menos un disco.',
  avg:(a,b)=>`Media de las fórmulas de Epley (${a} ${S.unit}) y Brzycki (${b} ${S.unit}).`,low:' Con más de 12 repeticiones la estimación es menos fiable.',
  pct:'Porcentaje',load:'Carga',side:'Por cada lado: ',none:'Solo la barra, sin discos.',total:'Peso total cargado: ',
  short:x=>` No se puede llegar exactamente al objetivo con estos discos; faltan ${x} ${S.unit}.`}
};
// Plate colours and sizes per unit
const PL={
 kg:[{u:25,c:'#c8312b',h:110},{u:20,c:'#1f5fa8',h:110},{u:15,c:'#c9a400',h:96},{u:10,c:'#2e8b4f',h:82},{u:5,c:'#6b7580',h:66},{u:2.5,c:'#3a424a',h:52},{u:1.25,c:'#8a949d',h:42}],
 lb:[{u:45,c:'#1f5fa8',h:110},{u:35,c:'#c9a400',h:96},{u:25,c:'#2e8b4f',h:82},{u:10,c:'#6b7580',h:66},{u:5,c:'#3a424a',h:52},{u:2.5,c:'#8a949d',h:42}]
};
const FLAGS={
 en:'<svg viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#c8102e" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="12"/><path d="M30 0V40M0 20H60" stroke="#c8102e" stroke-width="7"/></svg>',
 es:'<svg viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/></svg>'
};
const $=id=>document.getElementById(id);
let S={};
try{S=JSON.parse(localStorage.getItem('sc')||'{}')}catch(e){}
S.lang=S.lang||((navigator.language||'en').slice(0,2)==='es'?'es':'en');
S.unit=S.unit||'kg';
S.off=S.off||{kg:[],lb:[]};
const save=()=>{try{localStorage.setItem('sc',JSON.stringify(S))}catch(e){}};
const T=k=>{const v=I[S.lang][k];return typeof v==='function'?v():v};
const fmt=n=>{const s=String(Math.round(n*100)/100);return S.lang==='es'?s.replace('.',','):s};
const r05=n=>Math.round(n*2)/2;
let shown1=false,shown2=false,shown3=false,shown4=false;

function calc1RM(){
  shown1=true;
  const w=parseFloat($('w').value),r=parseInt($('r').value,10),o=$('o1');
  if(!(w>0)||!(r>=1)||r>30){o.innerHTML=`<p class="err">${T('e1')}</p>`;return}
  const ep=r===1?w:w*(1+r/30),br=r<37?w*36/(37-r):ep,rm=(ep+br)/2;
  let rows='';
  [100,95,90,85,80,75,70,60].forEach(p=>rows+=`<tr><td>${p}%</td><td>${fmt(r05(rm*p/100))} ${S.unit}</td></tr>`);
  o.innerHTML=`<div class="big">${fmt(r05(rm))} ${S.unit}</div><p class="note">${I[S.lang].avg(fmt(r05(ep)),fmt(r05(br)))}${r>12?T('low'):''}</p>
  <table><tr><th>${T('pct')}</th><th>${T('load')}</th></tr>${rows}</table>`;
}

function calcPlates(){
  shown2=true;
  const t=parseFloat($('t').value),bar=parseFloat($('bw').value),o=$('o2');
  const set=PL[S.unit].filter(p=>!S.off[S.unit].includes(p.u));
  if(!(t>0)||!(bar>=0)||t<bar){o.innerHTML=`<p class="err">${T('e2')}</p>`;return}
  if(!set.length){o.innerHTML=`<p class="err">${T('e3')}</p>`;return}
  let left=(t-bar)/2;const used=[];
  set.forEach(p=>{const n=Math.floor((left+1e-9)/p.u);if(n>0){used.push({p,n});left=Math.round((left-n*p.u)*1000)/1000}});
  let viz='<div class="bar" aria-hidden="true"><div class="shaft"></div>';const txt=[];
  used.forEach(u=>{for(let i=0;i<u.n;i++)viz+=`<div class="plate" style="height:${u.p.h}px;background:${u.p.c}">${fmt(u.p.u)}</div>`;txt.push(`${u.n} × ${fmt(u.p.u)} ${S.unit}`)});
  viz+='</div>';
  const total=t-2*left;
  o.innerHTML=(used.length?viz+`<p class="list">${T('side')}${txt.join(' + ')}</p>`:`<p class="list">${T('none')}</p>`)+
   `<p class="note">${T('total')}${fmt(total)} ${S.unit}.${left>0.001?I[S.lang].short(fmt(left*2)):''}</p>`;
}

const enabled=()=>PL[S.unit].filter(p=>!S.off[S.unit].includes(p.u));
function load(side){
  let left=side;const used=[];
  enabled().forEach(p=>{const n=Math.floor((left+1e-9)/p.u);if(n>0){used.push({p,n});left=Math.round((left-n*p.u)*1000)/1000}});
  return {used,left};
}
// Nearest weight you can actually load with the enabled plates
function snap(x,bar){
  const set=enabled(),side=Math.max(0,(x-bar)/2),a=load(side),lo=side-a.left,hi=lo+set[set.length-1].u;
  const side2=(side-lo<=hi-side)?lo:hi,b=load(side2);
  return {total:bar+2*(side2-b.left),used:b.used};
}
const sideTxt=u=>u.length?u.map(x=>`${x.n}×${fmt(x.p.u)}`).join(' + '):T('barOnly');

function calcWarm(){
  shown3=true;
  const w=parseFloat($('ww').value),bar=parseFloat($('bw').value),o=$('o3');
  if(!(w>0)||!(bar>=0)||w<=bar){o.innerHTML=`<p class="err">${T('e4')}</p>`;return}
  if(!enabled().length){o.innerHTML=`<p class="err">${T('e3')}</p>`;return}
  const rows=[];let prev=-1;
  [[0,10],[.4,5],[.6,3],[.8,2],[.9,1]].forEach(([p,r])=>{
    const x=p===0?{total:bar,used:[]}:snap(w*p,bar);
    if(x.total>prev&&x.total<w){rows.push({t:x.total,r:'× '+r,u:x.used});prev=x.total}
  });
  const f=snap(w,bar);rows.push({t:f.total,r:T('work'),u:f.used});
  o.innerHTML=`<table><tr><th>${T('load')}</th><th>${T('reps')}</th><th>${T('persd')}</th></tr>`+
   rows.map(x=>`<tr><td>${fmt(x.t)} ${S.unit}</td><td>${x.r}</td><td>${sideTxt(x.u)}</td></tr>`).join('')+
   `</table><p class="note" style="margin-top:10px">${T('wnote')}</p>`;
}

function calcSets(){
  shown4=true;
  const rm=parseFloat($('rm3').value),n=parseInt($('ns').value,10),r=parseInt($('nr').value,10),p=parseFloat($('np').value),bar=parseFloat($('bw').value),o=$('o4');
  if(!(rm>0)||!(n>=1)||!(r>=1)||!(p>0)||p>100){o.innerHTML=`<p class="err">${T('e5')}</p>`;return}
  if(!enabled().length){o.innerHTML=`<p class="err">${T('e3')}</p>`;return}
  const mx=Math.max(1,Math.floor(37-36*p/100+1e-9));
  if(r>mx){o.innerHTML=`<p class="err">${I[S.lang].e6(fmt(p),mx)}</p>`;return}
  const raw=rm*p/100,x=raw<=bar?{total:bar,used:[]}:snap(raw,bar),side=sideTxt(x.used);
  o.innerHTML=`<div class="big">${fmt(x.total)} ${S.unit}</div><p class="list">${I[S.lang].sch(n,r,fmt(p))}</p>
   <p class="note">${T('side')}${side}</p>${Math.abs(x.total-raw)>0.01?`<p class="note">${I[S.lang].rnd(fmt(Math.round(raw*100)/100))}</p>`:''}`;
}

function chips(){
  $('chips').innerHTML=PL[S.unit].map(p=>`<label><input type="checkbox" data-u="${p.u}" ${S.off[S.unit].includes(p.u)?'':'checked'}> ${fmt(p.u)} ${S.unit}</label>`).join('');
  $('chips').querySelectorAll('input').forEach(c=>c.addEventListener('change',()=>{
    const u=parseFloat(c.dataset.u),off=S.off[S.unit];
    S.off[S.unit]=c.checked?off.filter(x=>x!==u):off.concat(u);save();if(shown2)calcPlates();
  }));
}

function render(){
  document.documentElement.lang=S.lang;
  document.title=T('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  $('unit').value=S.unit;
  $('flag').innerHTML=FLAGS[S.lang];
  const lab=S.lang==='en'?'Cambiar a español':'Switch to English';
  $('flag').setAttribute('aria-label',lab);$('flag').title=lab;
  chips();
  if(shown1)calc1RM();
  if(shown2)calcPlates();
  if(shown3)calcWarm();
  if(shown4)calcSets();
}

$('flag').addEventListener('click',()=>{S.lang=S.lang==='en'?'es':'en';save();render()});
$('unit').addEventListener('change',e=>{S.unit=e.target.value;$('bw').value=S.unit==='kg'?20:45;save();render()});
$('b1').addEventListener('click',calc1RM);
$('b2').addEventListener('click',calcPlates);
$('b3').addEventListener('click',calcWarm);
$('b4').addEventListener('click',calcSets);
$('pre').addEventListener('change',e=>{const m=e.target.value.match(/(\d+)x(\d+)@(\d+)/);$('ns').value=m[1];$('nr').value=m[2];$('np').value=m[3]});
if(S.unit==='lb')$('bw').value=45;
render();
</script>
</body>
</html>
