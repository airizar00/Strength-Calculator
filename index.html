<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c2126">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Strength Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#1c2126;--mute:#5d6770;--line:#d5dade;--accent:#1c2126;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--ink:#eef0f2;--mute:#97a1ab;--line:#2f373e;--accent:#eef0f2;--onaccent:#14181c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.2px}
h1{font-size:2rem;margin:8px 0 4px}
h2{font-size:1.4rem;margin:0 0 12px}
p.sub{color:var(--mute)}
.sub{margin:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
header h1{margin-top:0}
.tools{display:flex;align-items:flex-end;gap:10px}
.tools label{flex:none}
.tools select{width:auto;padding:6px 8px;font-size:.95rem}
#flag{width:46px;height:46px;margin:0;padding:6px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:8px}
#flag svg{width:100%;height:auto;display:block;border-radius:2px}
.grid{display:grid;gap:16px}
.grid section{margin-bottom:0}
@media(min-width:820px){main{max-width:1040px;padding:32px 28px 56px}h1{font-size:2.6rem}.grid{grid-template-columns:1fr 1fr;gap:24px;align-items:start}section{padding:24px}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px}
label{display:block;flex:1;font-size:.9rem;color:var(--mute)}
input[type=number],input[type=text],input[type=date],select{width:100%;margin-top:4px;padding:10px;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button{margin-top:14px;width:100%;padding:12px;font:inherit;font-weight:600;color:var(--onaccent);background:var(--accent);border:0;border-radius:6px;cursor:pointer}
.big{font-size:3rem;line-height:1;margin:16px 0 4px}
.note{color:var(--mute);font-size:.9rem;margin:0}
.err{color:#c8312b;margin:12px 0 0}
table{width:100%;border-collapse:collapse;margin-top:12px}
td,th{padding:6px 0;text-align:left;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
.bar{display:flex;align-items:center;height:110px;margin:16px 0 8px}
.shaft{height:10px;width:34px;background:#8a949d;border-radius:2px 0 0 2px}
.plate{width:16px;margin-right:3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff}
.list{margin:0;font-weight:600}
details{margin-top:14px}
.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.seg button{width:auto;margin:0;padding:6px 12px}
.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.sub2{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:1.25rem;margin:22px 0 6px}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pr{border:1px solid var(--line);border-radius:8px;padding:10px}
.pr b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:1.5rem;line-height:1.15}
.pr span{display:block;color:var(--mute);font-size:.85rem}
@media(min-width:820px){.prs{grid-template-columns:repeat(4,1fr)}}
.srow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center;margin-top:8px}
.srow input{margin-top:0}
.srow .mini{width:100%;padding:8px 0}
.hdr{font-size:.9rem;color:var(--mute);margin-top:14px}
.sn{color:var(--mute);font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.mini{width:auto;margin:0;padding:2px 8px}
#hchart svg{width:100%;height:auto;margin-top:10px}
#hchart text{fill:var(--mute);font-size:11px}
#hchart .ln{fill:none;stroke:var(--ink);stroke-width:2}
#hchart .gr{stroke:var(--line)}
#hchart circle{fill:var(--ink)}
summary{cursor:pointer;color:var(--mute);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips label{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink)}
[hidden]{display:none!important}
.rtd{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:4.5rem;line-height:1;text-align:center;padding:18px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.rtd.done{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
@media(prefers-reduced-motion:no-preference){.rtd.done{animation:rtpulse 1s ease-in-out 3}}
@keyframes rtpulse{50%{opacity:.55}}
.rtb{display:flex;gap:12px}
.rtb button{flex:1}
@media(min-width:820px){.rtd{font-size:5.5rem}}
</style>
</head>
<body>
<main>
<header>
<div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div>
<div class="tools">
<label><span data-i="units"></span><select id="unit"><option value="kg">kg</option><option value="lb">lb</option></select></label>
<button id="flag" type="button"></button>
</div>
</header>

<div class="grid">
<section aria-labelledby="t1">
<h2 id="t1" data-i="t1"></h2>
<div class="row">
<label><span data-i="wt"></span><input id="w" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<label><span data-i="reps"></span><input id="r" type="number" inputmode="numeric" min="1" max="30" step="1" value="5"></label>
</div>
<button id="b1" data-i="b1"></button>
<div id="o1" aria-live="polite"></div>
</section>

<section aria-labelledby="t2">
<h2 id="t2" data-i="t2"></h2>
<div class="row">
<label><span data-i="tgt"></span><input id="t" type="number" inputmode="decimal" min="0" step="0.5" value="102.5"></label>
<label><span data-i="bar"></span><input id="bw" type="number" inputmode="decimal" min="0" step="0.5" value="20"></label>
</div>
<details><summary data-i="avail"></summary><div class="chips" id="chips"></div></details>
<button id="b2" data-i="b2"></button>
<div id="o2" aria-live="polite"></div>
</section>

<section aria-labelledby="t3">
<h2 id="t3" data-i="tw"></h2>
<label><span data-i="ww"></span><input id="ww" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<button id="b3" data-i="bww"></button>
<div id="o3" aria-live="polite"></div>
</section>

<section aria-labelledby="t4">
<h2 id="t4" data-i="ts"></h2>
<div class="row">
<label><span data-i="rm3"></span><input id="rm3" type="number" inputmode="decimal" min="0" step="0.5" value="100"></label>
<label><span data-i="preset"></span><select id="pre"><option value="5x5@80">5 × 5 @ 80%</option><option value="3x8@70">3 × 8 @ 70%</option><option value="4x6@75">4 × 6 @ 75%</option><option value="5x3@85">5 × 3 @ 85%</option><option value="3x10@65">3 × 10 @ 65%</option></select></label>
</div>
<div class="row" style="margin-top:12px">
<label><span data-i="ns"></span><input id="ns" type="number" inputmode="numeric" min="1" step="1" value="5"></label>
<label><span data-i="reps"></span><input id="nr" type="number" inputmode="numeric" min="1" step="1" value="5"></label>
<label><span data-i="np"></span><input id="np" type="number" inputmode="decimal" min="1" max="100" step="0.5" value="80"></label>
</div>
<button id="b4" data-i="bs"></button>
<div id="o4" aria-live="polite"></div>
</section>

<section class="wide" aria-labelledby="t6">
<h2 id="t6" data-i="trt"></h2>
<div id="rtd" class="rtd" role="timer" aria-live="off">2:00</div>
<div class="seg" id="rtp"><button type="button" class="sec" data-s="60">1:00</button><button type="button" class="sec" data-s="90">1:30</button><button type="button" class="sec" data-s="120">2:00</button><button type="button" class="sec" data-s="180">3:00</button><button type="button" class="sec" data-s="300">5:00</button></div>
<label style="margin-top:12px"><span data-i="rtcustom"></span><input id="rtc" type="number" inputmode="numeric" min="5" max="3600" step="5"></label>
<div class="rtb"><button id="rtgo" type="button"></button><button id="rtreset" class="sec" type="button" data-i="rtreset"></button></div>
<div class="chips"><label><input type="checkbox" id="rts1"> <span data-i="rtsound"></span></label><label id="rtvl"><input type="checkbox" id="rtv"> <span data-i="rtvib"></span></label></div>
<p class="note" id="rtmsg" aria-live="polite" style="margin-top:10px"></p>
<p class="note" style="margin-top:10px" data-i="rtnote"></p>
</section>

<section class="wide" aria-labelledby="t5">
<h2 id="t5" data-i="th"></h2>
<div class="row">
<label><span data-i="hex"></span><select id="hx"></select></label>
<label><span data-i="hdate"></span><input id="hd" type="date"></label>
</div>
<div class="srow hdr" aria-hidden="true"><span></span><span data-i="wt"></span><span data-i="reps"></span><span></span></div>
<div id="hsets"></div>
<button id="hmore" class="sec" type="button" data-i="hadds"></button>
<button id="hadd" data-i="hadd"></button>
<p class="note" id="hmsg" aria-live="polite" style="margin-top:10px"></p>
<div class="prs" id="hbest"></div>
<div class="seg" id="hrange"><button type="button" class="sec" data-r="14" data-i="r14"></button><button type="button" class="sec" data-r="30" data-i="r30"></button><button type="button" class="sec" data-r="90" data-i="r90"></button><button type="button" class="sec" data-r="365" data-i="r365"></button><button type="button" class="sec" data-r="0" data-i="r0"></button></div>
<div id="hchart"></div>
<div class="sub2" data-i="hprog"></div>
<div id="hsug"></div>
<div class="sub2" data-i="hgoal"></div>
<label><span data-i="hgw"></span><input id="hg" type="number" inputmode="decimal" min="0" step="0.5"></label>
<div id="hgo" aria-live="polite"></div>
<div id="hl"></div>
<details><summary data-i="hmanage"></summary>
<label style="margin-top:10px"><span data-i="hnew"></span><input id="hn" type="text" maxlength="40"></label>
<button id="hax" class="sec" data-i="haddex"></button>
<button id="hdx" class="sec" data-i="hdelex"></button>
<button id="hexp" class="sec" data-i="hexp"></button>
<button id="himp" class="sec" data-i="himp"></button>
<input id="hf" type="file" accept="application/json,.json" hidden>
</details>
<p class="note" style="margin-top:14px" data-i="hnote"></p>
</section>
</div>
</main>

function calcPlates(){
  shown2=true;
  const t=parseFloat($('t').value),bar=parseFloat($('bw').value),o=$('o2');
  const set=PL[S.unit].filter(p=>!S.off[S.unit].includes(p.u));
  if(!(t>0)||!(bar>=0)||t<bar){o.innerHTML=`<p class="err">${T('e2')}</p>`;return}
  if(!set.length){o.innerHTML=`<p class="err">${T('e3')}</p>`;return}
  let left=(t-bar)/2;const used=[];
  set.forEach(p=>{const n=Math.floor((left+1e-9)/p.u);if(n>0){used.push({p,n});left=Math.round((left-n*p.u)*1000)/1000}});
  let viz='<div class="bar" aria-hidden="true"><div class="shaft"></div>';const txt=[];
  used.forEach(u=>{for(let i=0;i<u.n;i++)viz+=`<div class="plate" style="height:${u.p.h}px;background:${u.p.c}">${fmt(u.p.u)}</div>`;txt.push(`${u.n} × ${fmt(u.p.u)} ${S.unit}`)});
  viz+='</div>';
  const total=t-2*left;
  o.innerHTML=(used.length?viz+`<p class="list">${T('side')}${txt.join(' + ')}</p>`:`<p class="list">${T('none')}</p>`)+
   `<p class="note">${T('total')}${fmt(total)} ${S.unit}.${left>0.001?I[S.lang].short(fmt(left*2)):''}</p>`;
}

const enabled=()=>PL[S.unit].filter(p=>!S.off[S.unit].includes(p.u));
function load(side){
  let left=side;const used=[];
  enabled().forEach(p=>{const n=Math.floor((left+1e-9)/p.u);if(n>0){used.push({p,n});left=Math.round((left-n*p.u)*1000)/1000}});
  return {used,left};
}
// Nearest weight you can actually load with the enabled plates
function snap(x,bar){
  const set=enabled(),side=Math.max(0,(x-bar)/2),a=load(side),lo=side-a.left,hi=lo+set[set.length-1].u;
  const side2=(side-lo<=hi-side)?lo:hi,b=load(side2);
  return {total:bar+2*(side2-b.left),used:b.used};
}
const sideTxt=u=>u.length?u.map(x=>`${x.n}×${fmt(x.p.u)}`).join(' + '):T('barOnly');

function calcWarm(){

  const rows=[];let prev=-1;
  [[0,10],[.4,5],[.6,3],[.8,2],[.9,1]].forEach(([p,r])=>{
    const x=p===0?{total:bar,used:[]}:snap(w*p,bar);
    if(x.total>prev&&x.total<w){rows.push({t:x.total,r:'× '+r,u:x.used});prev=x.total}
  });

function chart(pts){
  const W=600,Ht=190,L=46,R=12,Tp=12,B=26,ts=pts.map(p=>p.t),t0=Math.min(...ts),t1=Math.max(...ts),vs=pts.map(p=>p.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);const mn=lo,mx=hi;
  if(hi-lo<1){lo-=1;hi+=1}
  const pad=(hi-lo)*.1;lo-=pad;hi+=pad;
  const X=t=>t1===t0?(L+W-R)/2:L+(t-t0)/(t1-t0)*(W-L-R),Y=v=>Tp+(hi-v)/(hi-lo)*(Ht-Tp-B);
  const line=pts.map(p=>`${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"/>`).join('');
  const first=pts[0].d,last=pts[pts.length-1].d;
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${T('hchart')}">
   <line class="gr" x1="${L}" x2="${W-R}" y1="${Y(mx)}" y2="${Y(mx)}"/><line class="gr" x1="${L}" x2="${W-R}" y1="${Y(mn)}" y2="${Y(mn)}"/>
   <text x="${L-6}" y="${Y(mx)+4}" text-anchor="end">${fmt(r05(mx))}</text><text x="${L-6}" y="${Y(mn)+4}" text-anchor="end">${fmt(r05(mn))}</text>
   <polyline class="ln" points="${line}"/>${dots}
   <text x="${t1===t0?(L+W-R)/2:L}" y="${Ht-6}" text-anchor="${t1===t0?'middle':'start'}">${esc(first)}</text>${t1===t0?'':`<text x="${W-R}" y="${Ht-6}" text-anchor="end">${esc(last)}</text>`}</svg>`;
}

const MONTHLY=0.02; // rough monthly gain used to judge goals
function loadable(x){
  const bar=parseFloat($('bw').value);

}
function renderCoach(pts){
  const L=I[S.lang],g=H.goals[H.cur],hg=$('hg');
  if(document.activeElement!==hg)hg.value=g?String(Math.round(conv(g.w,g.u)*100)/100):'';
  if(!pts.length){$('hsug').innerHTML=`<p class="note">${T('hs0')}</p>`;$('hgo').innerHTML=`<p class="note">${g?T('hgnone'):T('hg0')}</p>`;return}
  const rec=pts.filter(p=>p.t>=Date.now()-28*864e5),ref=rec.length?rec:[pts[pts.length-1]],E=Math.max(...ref.map(p=>p.v));
  let html=`<p class="note">${L.hsbase(fmt(r05(E)),T(rec.length?'hwk':'hlast'))}</p>`;
  if(rec.length>1)html+=`<p class="note">${L.hstr(fmt(r05(rec[0].v)),fmt(r05(rec[rec.length-1].v)))}</p>`;
  html+='<table>'+[['hsg1',5,3,85],['hsg2',4,6,75],['hsg3',3,10,65]].map(([k,n,r,q])=>`<tr><td>${T(k)}</td><td>${n} × ${r} @ ${q}%</td><td>${fmt(loadable(E*q/100))} ${S.unit}</td></tr>`).join('')+`</table><p class="note" style="margin-top:8px">${T('hsnote')}</p>`;
  $('hsug').innerHTML=html;
  if(!g){$('hgo').innerHTML=`<p class="note">${T('hg0')}</p>`;return}
  const G=conv(g.w,g.u),gap=G/E-1,months=gap/MONTHLY,gs=g.u===S.unit?fmt(G):fmt(Math.round(G*10)/10);
  let out=`<p class="list">${gs} ${S.unit}</p>`;
  if(gap<=0.0001){
    const n=Math.floor(37-36*(G/E)+1e-9);
    out+=`<p class="note">${T('hgnow')}</p>`+(n>=1&&n<=30?`<p class="note">${L.hgreps(gs,n)}</p>`:'');
  }else{
    out+=`<p class="note">${months<=3?L.hgsoon(Math.max(1,Math.round(months*4.33))):months<=9?L.hglong(Math.max(1,Math.round(months))):L.hgnot(Math.round(gap*100))}</p>`;
    if(months>3&&gap>0.04)out+=`<p class="note">${L.hgmile(fmt(loadable(E*1.04)),Math.round(0.04/MONTHLY*4.33))}</p>`;
    out+=`<p class="note">${T('hgest')}</p>`;
  }

function renderHist(){
  const sel=$('hx');
  sel.innerHTML=H.ex.map(n=>`<option value="${esc(n)}">${esc(exName(n))}</option>`).join('');
  if(!H.ex.includes(H.cur))H.cur=H.ex[0];
  if(H.cur!==undefined)sel.value=H.cur;
  if(!H.ex.length){$('hbest').textContent='';$('hchart').innerHTML='';$('hl').innerHTML=`<p class="note">${T('hnoex')}</p>`;$('hsug').innerHTML='';$('hgo').innerHTML='';return}
  const pts=H.log.filter(x=>x.ex===H.cur).map(x=>{const ss=setsOf(x);return {id:x.id,d:x.date,t:Date.parse(x.date),u:x.u,ss,v:Math.max(...ss.map(q=>conv(e1(q.w,q.r),x.u))),vol:conv(ss.reduce((t,q)=>t+q.w*q.r,0),x.u)}}).sort((x,y)=>x.t-y.t);
  if(!pts.length){$('hbest').textContent='';$('hchart').innerHTML='';$('hl').innerHTML=`<p class="note">${T('hnone')}</p>`;renderCoach([]);return}
  const best=Math.max(...pts.map(p=>p.v));

  let hw=null,hv=null,hs=null;
  pts.forEach(p=>{
    p.ss.forEach(q=>{
      const w=conv(q.w,p.u),v=w*q.r,same=p.u===S.unit;
      if(!hw||w>hw.w+1e-9)hw={w,same,d:p.d};
      if(!hs||v>hs.v+1e-9)hs={v,w,same,r:q.r,d:p.d};
    });
    if(!hv||p.vol>hv.v+1e-9)hv={v:p.vol,d:p.d};
  });
  const dw=(x,same)=>same?fmt(x):fmt(Math.round(x*10)/10);
  const card=(l,v,d)=>`<div class="pr"><span>${l}</span><b>${v}</b><span>${d}</span></div>`;
  $('hbest').innerHTML=card(T('hpr1'),`${fmt(r05(best))} ${S.unit}`,esc(bestP.d))+
   card(T('hpr2'),`${dw(hw.w,hw.same)} ${S.unit}`,esc(hw.d))+
   card(T('hpr3'),`${fmt(Math.round(hv.v))} ${S.unit}`,esc(hv.d))+
   card(T('hpr4'),`${fmt(Math.round(hs.v))} ${S.unit}`,`${dw(hs.w,hs.same)} × ${hs.r} · ${esc(hs.d)}`);

  $('hl').innerHTML=`<table><tr><th>${T('hdate')}</th><th>${T('hwr')}</th><th>${T('he1rm')}</th><th></th></tr>`+
   pts.slice().reverse().slice(0,12).map(p=>`<tr><td>${esc(p.d)}</td><td>${p.ss.map(q=>`${fmt(q.w)}×${q.r}`).join(', ')} ${p.u}<br><span class="note">${T('hvol')}: ${fmt(Math.round(p.vol))} ${S.unit}</span></td><td>${fmt(r05(p.v))}${p.v===best?' ★':''}</td><td><button class="sec mini" data-del="${esc(p.id)}" aria-label="${T('hdel')}">✕</button></td></tr>`).join('')+'</table>';
  renderCoach(pts);
}

// ---------- Rest timer ----------
const RT={left:0,endAt:0,running:false,done:false,iv:null,ctx:null,nodes:[],wl:null};
S.rt=Object.assign({dur:120,sound:true,vib:true},S.rt||{});
if(!(S.rt.dur>=5&&S.rt.dur<=3600))S.rt.dur=120;
RT.left=S.rt.dur*1000;
const mmss=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};

function rtCancelAudio(){RT.nodes.forEach(o=>{try{o.stop()}catch(e){}try{o.disconnect()}catch(e){}});RT.nodes=[]}
// The 3 beeps are scheduled on the audio clock for the moment the countdown ends
function rtBeeps(){
  rtCancelAudio();
  if(!S.rt.sound||!RT.running)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    RT.ctx=RT.ctx||new AC();
    if(RT.ctx.state==='suspended')RT.ctx.resume();
    const t0=RT.ctx.currentTime+Math.max(0,RT.endAt-Date.now())/1000;
    for(let i=0;i<3;i++){
      const o=RT.ctx.createOscillator(),g=RT.ctx.createGain(),st=t0+i*.32;
      o.type='sine';o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(.4,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.22);
      o.connect(g);g.connect(RT.ctx.destination);o.start(st);o.stop(st+.25);
      RT.nodes.push(o);
    }
  }catch(e){}
}
async function rtLock(){
  try{
    if('wakeLock' in navigator&&!RT.wl){
      RT.wl=await navigator.wakeLock.request('screen');
      RT.wl.addEventListener('release',()=>{RT.wl=null});
      if(!RT.running)rtUnlock();
    }
  }catch(e){}
}
function rtUnlock(){try{if(RT.wl)RT.wl.release()}catch(e){}RT.wl=null}

function rtRender(){
  const d=$('rtd'),go=$('rtgo');
  d.textContent=mmss(RT.left);d.classList.toggle('done',RT.done);
  go.textContent=T(RT.running?'rtpause':(!RT.done&&RT.left>0&&RT.left<S.rt.dur*1000)?'rtresume':'rtstart');
  document.querySelectorAll('#rtp button').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.rt.dur));
  $('rts1').checked=!!S.rt.sound;$('rtv').checked=!!S.rt.vib;
  $('rtvl').hidden=!navigator.vibrate;
  const msg=RT.done?T('rtdone'):'';
  if($('rtmsg').textContent!==msg)$('rtmsg').textContent=msg;
  if(document.activeElement!==$('rtc'))$('rtc').value=[60,90,120,180,300].includes(S.rt.dur)?'':S.rt.dur;
  document.title=RT.running?`${mmss(RT.left)} · ${T('title')}`:RT.done?`⏱ ${T('rtdone')}`:T('title');
}
function rtFinish(){
  RT.running=false;RT.done=true;RT.left=0;clearInterval(RT.iv);rtUnlock();
  if(S.rt.vib&&navigator.vibrate){try{navigator.vibrate([300,150,300,150,500])}catch(e){}}
  rtRender();
}
function rtTick(){
  if(!RT.running)return;
  RT.left=RT.endAt-Date.now();
  if(RT.left<=0)rtFinish();else rtRender();
}
function rtStart(){
  if(RT.running)return;
  if(RT.done||RT.left<=0){RT.left=S.rt.dur*1000;RT.done=false}
  RT.endAt=Date.now()+RT.left;RT.running=true;
  clearInterval(RT.iv);RT.iv=setInterval(rtTick,250);
  rtLock();rtBeeps();rtRender();
}
function rtPause(){
  if(!RT.running)return;
  RT.left=Math.max(0,RT.endAt-Date.now());RT.running=false;
  clearInterval(RT.iv);rtCancelAudio();rtUnlock();rtRender();
}
function rtReset(){
  RT.running=false;RT.done=false;RT.left=S.rt.dur*1000;
  clearInterval(RT.iv);rtCancelAudio();rtUnlock();rtRender();
}
function rtSetDur(sec){
  S.rt.dur=sec;save();
  if(RT.running){RT.endAt=Date.now()+sec*1000;RT.left=sec*1000;rtBeeps()}
  else{RT.left=sec*1000;RT.done=false}
  rtRender();
}

function render(){
  delArm=null;
  document.documentElement.lang=S.lang;
  document.title=T('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  $('unit').value=S.unit;
  $('flag').innerHTML=FLAGS[S.lang];
  const lab=S.lang==='en'?'Cambiar a español':'Switch to English';
  $('flag').setAttribute('aria-label',lab);$('flag').title=lab;
  chips();
  if(shown1)calc1RM();
  if(shown2)calcPlates();
  if(shown3)calcWarm();
  if(shown4)calcSets();
  labelRows();
  renderHist();
  rtRender();
}

$('flag').addEventListener('click',()=>{S.lang=S.lang==='en'?'es':'en';save();render()});
$('unit').addEventListener('change',e=>{S.unit=e.target.value;$('bw').value=S.unit==='kg'?20:45;save();render()});
$('b1').addEventListener('click',calc1RM);
$('b2').addEventListener('click',calcPlates);
$('b3').addEventListener('click',calcWarm);
$('b4').addEventListener('click',calcSets);
$('pre').addEventListener('change',e=>{const m=e.target.value.match(/(\d+)x(\d+)@(\d+)/);$('ns').value=m[1];$('nr').value=m[2];$('np').value=m[3]});
$('hx').addEventListener('change',e=>{delArm=null;$('hdx').textContent=T('hdelex');H.cur=e.target.value;saveH();$('hmsg').textContent='';renderHist()});
$('hrange').addEventListener('click',e=>{const b=e.target.closest('button[data-r]');if(!b)return;H.range=+b.dataset.r;saveH();renderHist()});
$('hg').addEventListener('change',e=>{const v=parseFloat(e.target.value);if(!H.cur)return;if(v>0)H.goals[H.cur]={w:v,u:S.unit};else delete H.goals[H.cur];saveH();renderHist()});
$('hadd').addEventListener('click',addEntry);
$('hmore').addEventListener('click',()=>{const l=$('hsets').lastElementChild;addSetRow(l?l.querySelector('.sw').value:'',l?l.querySelector('.sr').value:'')});
$('hsets').addEventListener('click',e=>{const b=e.target.closest('.rm');if(!b)return;const row=b.parentNode;if($('hsets').children.length>1){row.remove();labelRows()}else{row.querySelector('.sw').value='';row.querySelector('.sr').value=''}});
$('hax').addEventListener('click',addEx);
$('hdx').addEventListener('click',delEx);
$('hexp').addEventListener('click',exportH);
$('himp').addEventListener('click',()=>$('hf').click());
$('hf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importH(String(rd.result));rd.readAsText(f);e.target.value=''});
$('hl').addEventListener('click',e=>{const b=e.target.closest('button[data-del]');if(!b)return;H.log=H.log.filter(x=>x.id!==b.dataset.del);saveH();renderHist()});
$('rtgo').addEventListener('click',()=>RT.running?rtPause():rtStart());
$('rtreset').addEventListener('click',rtReset);
$('rtp').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(b)rtSetDur(+b.dataset.s)});
$('rtc').addEventListener('change',e=>{const v=Math.round(parseFloat(e.target.value));if(v>=5&&v<=3600)rtSetDur(v);else rtRender()});
$('rts1').addEventListener('change',e=>{S.rt.sound=e.target.checked;save();rtBeeps()});
$('rtv').addEventListener('change',e=>{S.rt.vib=e.target.checked;save()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RT.running){rtTick();rtLock()}});
$('hd').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
addSetRow('','');
if(S.unit==='lb')$('bw').value=45;
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
